name: Plugin submission
description: Submit one public DSH plugin package for the directory.
title: "[Plugin]: "
labels:
  - plugin-submission
body:
  - type: markdown
    attributes:
      value: |
        Submit **one plugin package per issue**. A repository with several packages needs one issue per package.

        Submissions are checked automatically when the issue is opened and then once per day for seven days.
        Accepted submissions receive a reply with their directory URL and are closed. Unaccepted submissions
        are closed after the final check and may be submitted again later.

        See the [contributing guide](https://github.com/alexchenzl/dsh-plugin-directory/blob/main/CONTRIBUTING.md)
        for the full eligibility rules.

  - type: input
    id: url
    attributes:
      label: Plugin package URL
      description: >-
        The exact GitHub directory that is the plugin package root, on the repository's current default
        branch. Do not link a `package.json`, patch file, README, or any other single file.
      placeholder: https://github.com/owner/repository/tree/main/path/to/plugin
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Primary category
      description: Choose the one category that best describes the plugin's main capability.
      options:
        - Models & Providers (models)
        - Tools (tools)
        - Skills (skills)
        - Sessions (sessions)
        - Sandboxes (sandboxes)
        - Storage (storage)
        - Agent Loops (loops)
        - Scheduling (scheduling)
        - User Interface (ui)
    validations:
      required: true

  - type: input
    id: description
    attributes:
      label: One-line description
      description: >-
        Plainly summarize the plugin's main capability in a single line. Avoid rankings, comparisons,
        and promotional language.
      placeholder: Adds persistent conversation memory backed by a local vector store.
    validations:
      required: true

  - type: textarea
    id: install
    attributes:
      label: Install command
      description: >-
        Copy the installation command from the plugin's own README or package documentation. When both an
        npm package and a Git-source install are documented, prefer the npm command. The command is stored
        and rendered as inert text and is never executed.
      placeholder: dsh plugin --profile <name> add <package>
      render: shell
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Do not add the plugin name, author, stars, license, README, or version — those come from the source
        repository. Submitting a repository does not establish ownership, and acceptance is not an
        endorsement, compatibility guarantee, runtime test, or security audit.
