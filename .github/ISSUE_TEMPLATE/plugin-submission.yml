name: Plugin submission
description: Submit one public DSH plugin package for the directory.
title: "[Plugin]: "
labels:
  - plugin-submission
body:
  - type: markdown
    attributes:
      value: |
        Submit **one plugin package per issue**. A repository with several packages needs one issue per package.

        Please read the [contributing guide](https://github.com/alexchenzl/dsh-plugin-directory/blob/main/CONTRIBUTING.md)
        before submitting to confirm your plugin meets the eligibility rules.

  - type: input
    id: url
    attributes:
      label: Plugin package URL
      description: |-
        The GitHub URL of the folder that contains your plugin package.

        If the plugin lives at the root of the repository, use the repository URL as-is — no extra path needed.
        If the plugin lives in a subdirectory, include the full `/tree/<branch>/...` path to that folder.

        **Examples**

        **Root:** https://github.com/liustack/modlens

        **Subdirectory:** https://github.com/volcengine/OpenViking/tree/main/examples/dsh-memory-plugin
      placeholder: https://github.com/owner/repository/tree/main/path/to/plugin
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Primary category reference

        Choose based on **why a user would install the plugin**, not how the plugin is implemented.

        | Category | Use this for |
        | --- | --- |
        | Models & Providers | Model providers, authentication, routing, fallback, gateways |
        | Agents & Automation | Multi-agent systems, workflows, orchestration, scheduling, background tasks |
        | Memory & Knowledge | Persistent memory, RAG, knowledge bases, context management, semantic recall |
        | Sessions & History | Session history, import/export, branching, rewind, replay, handoff |
        | Coding & Dev Tools | Git, code review, terminals, editors, testing, debugging, developer workflows |
        | Web & Browser | Browser automation, web search, fetching, crawling, scraping |
        | Multimodal & Media | Vision, OCR, image generation, voice, speech, audio, video |
        | Channels & Notifications | Slack, Discord, Telegram, Feishu, webhooks, notifications, remote DSH access |
        | UI Enhancements | Functional UI improvements such as sidebars, navigation, composers, dashboards, GenUI |
        | Themes & Fun | Themes, skins, wallpapers, pets, games, music and novelty experiences |
        | Usage & Cost | Tokens, usage, balances, quotas, cost tracking, budgets |
        | Security & Permissions | Authentication, approvals, permissions, sandboxing, auditing, policy controls |
        | Plugins & Runtime | Plugin discovery/installers, plugin development tools, runtime infrastructure, alternative clients |

  - type: dropdown
    id: category
    attributes:
      label: Primary category
      description: Select the single category that best matches the plugin's main user-facing capability.
      options:
        - Models & Providers (models)
        - Agents & Automation (agents)
        - Memory & Knowledge (memory)
        - Sessions & History (sessions)
        - Coding & Dev Tools (coding)
        - Web & Browser (browser)
        - Multimodal & Media (multimodal)
        - Channels & Notifications (channels)
        - UI Enhancements (ui)
        - Themes & Fun (themes)
        - Usage & Cost (usage)
        - Security & Permissions (security)
        - Plugins & Runtime (plugin-tools)
    validations:
      required: true

  - type: input
    id: description
    attributes:
      label: One-line description
      description: Describe what the plugin does in one sentence.
      placeholder: Adds persistent conversation memory backed by a local vector store.
    validations:
      required: true

  - type: textarea
    id: install
    attributes:
      label: Install command
      description: The install command from your plugin's README that users can run as-is.
      placeholder: dsh plugin --profile <name> add <package>
      render: shell
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > **Help the directory grow**
        >
        > [Star this repo](https://github.com/alexchenzl/dsh-plugin-directory) to help more developers discover your plugin.
