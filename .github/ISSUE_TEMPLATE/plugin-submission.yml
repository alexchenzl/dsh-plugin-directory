name: Plugin submission
description: Submit one public DSH plugin package for the directory.
title: "[Plugin]: "
labels:
  - plugin-submission
body:
  - type: markdown
    attributes:
      value: |
        Submit **one plugin package per issue**. A repository with several packages needs one issue per package.

        Please read the [contributing guide](https://github.com/alexchenzl/dsh-plugin-directory/blob/main/CONTRIBUTING.md)
        before submitting to confirm your plugin meets the eligibility rules.

  - type: input
    id: url
    attributes:
      label: Plugin package URL
      description: |-
        The GitHub URL of the folder that contains your plugin package.

        If the plugin lives at the root of the repository, use the repository URL as-is — no extra path needed.
        If the plugin lives in a subdirectory, include the full `/tree/<branch>/...` path to that folder.

        **Examples**

        **Root:** https://github.com/liustack/modlens

        **Subdirectory:** https://github.com/volcengine/OpenViking/tree/main/examples/dsh-memory-plugin
      placeholder: https://github.com/owner/repository/tree/main/path/to/plugin
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Primary category
      description: Choose the one category that best describes the plugin's main capability.
      options:
        - Models & Providers (models)
        - Tools (tools)
        - Skills (skills)
        - Sessions (sessions)
        - Sandboxes (sandboxes)
        - Storage (storage)
        - Agent Loops (loops)
        - Scheduling (scheduling)
        - User Interface (ui)
    validations:
      required: true

  - type: input
    id: description
    attributes:
      label: One-line description
      description: Describe what the plugin does in one sentence.
      placeholder: Adds persistent conversation memory backed by a local vector store.
    validations:
      required: true

  - type: textarea
    id: install
    attributes:
      label: Install command
      description: The install command from your plugin's README that users can run as-is.
      placeholder: dsh plugin --profile <name> add <package>
      render: shell
    validations:
      required: true
