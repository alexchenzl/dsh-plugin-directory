name: Label plugin submissions

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'plugin-submission'
            const { title = '', body = '' } = context.payload.issue

            const looksLikeSubmission =
              /^\s*\[plugin\]\s*:/i.test(title) ||
              /^#{1,4}\s*Plugin package URL\s*$/im.test(body) ||
              /dsh\s+plugin\b.*\badd\b/i.test(body)

            if (!looksLikeSubmission) {
              core.info(`Issue #${context.payload.issue.number} does not look like a submission; skipping.`)
              return
            }

            if (context.payload.issue.labels.some(l => l.name === LABEL)) {
              core.info(`Issue #${context.payload.issue.number} already labelled; skipping.`)
              return
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: [LABEL],
            })
            core.info(`Labelled issue #${context.payload.issue.number} with ${LABEL}.`)
